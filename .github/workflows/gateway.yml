name: Gateway Docker Image

on:
  push:
    branches: [wasm]
    paths:
      - 'wasm/gateway/**'
      - 'src/network/**'
      - 'lib/enet/**'
      - 'CMakeLists.txt'
      - 'sources.cmake'
      - '.github/workflows/gateway.yml'
  pull_request:
    branches: [wasm]
    paths:
      - 'wasm/gateway/**'
      - 'src/network/**'
      - 'lib/enet/**'
      - 'CMakeLists.txt'
      - 'sources.cmake'
      - '.github/workflows/gateway.yml'
  workflow_dispatch:

concurrency:
  group: gateway-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-gateway:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run Rust gateway unit tests
        run: cargo test --locked --manifest-path wasm/gateway/Cargo.toml

  build-and-push:
    needs: test-gateway
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-gateway
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/wasm' }}

      - name: Build and push gateway image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: wasm/gateway/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=gateway
          cache-to: type=gha,scope=gateway,mode=max
