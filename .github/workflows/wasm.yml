name: WASM

# Build the WebAssembly port in the same pinned Emscripten container that is
# used locally (wasm/docker/Dockerfile), then deploy the static web root to
# Cloudflare Workers (static assets + a small Worker for the /api/token route,
# configured in wasm/wrangler.jsonc). It is published on the project's own
# workers.dev subdomain.
#
# Deployment only happens on pushes to the wasm branch (or manual runs) and only
# when the Cloudflare secrets are configured. Pull requests build but do not
# deploy.
#
# Required repository secrets for deployment:
#   CLOUDFLARE_API_TOKEN     API token with the "Edit Cloudflare Workers" permission.
#   CLOUDFLARE_ACCOUNT_ID    The Cloudflare account id.

on:
  push:
    branches: [wasm]
  pull_request:
    branches: [wasm]
  workflow_dispatch:

concurrency:
  group: wasm-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      IMAGE: stk-wasm-build:ci
      # Mapped to env so the deploy step's `if` can check whether the Cloudflare
      # credentials are configured (the `secrets` context is not allowed in `if`).
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build the Emscripten build image
        uses: docker/build-push-action@v7
        with:
          context: wasm/docker
          file: wasm/docker/Dockerfile
          tags: ${{ env.IMAGE }}
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The cross-compiled third-party libraries (wasm/prefix) are expensive to
      # build. build_deps.sh decides what to (re)build purely from what is
      # already installed in the prefix, so only the prefix needs to persist -
      # the sources/objects in wasm/build are not required once the prefix is
      # populated. The key is content-based, so this is rebuilt only when the
      # dependency script or the build image change.
      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: wasm/prefix
          key: wasm-deps-${{ hashFiles('wasm/build_deps.sh', 'wasm/docker/Dockerfile') }}

      # Compiler caches that make recompiling STK fast: ccache (C/C++ object
      # files) and Emscripten's system-library/port cache. They are updated on
      # every run, so use a unique key and fall back to the most recent cache.
      - name: Cache compiler caches (ccache + emscripten)
        uses: actions/cache@v6
        with:
          path: |
            wasm/.ccache
            wasm/.emcache
          key: wasm-ccache-${{ github.run_id }}
          restore-keys: |
            wasm-ccache-

      # The external art assets change rarely; keep the checkout warm and just
      # svn-update it on later runs.
      - name: Cache stk-assets
        uses: actions/cache@v6
        with:
          path: wasm/stk-assets
          key: stk-assets-${{ github.run_id }}
          restore-keys: |
            stk-assets-

      - name: Fetch stk-assets
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -v "$PWD":/src -w /src \
            "$IMAGE" wasm/get_assets.sh wasm/stk-assets

      # The svn revision of the checkout keys the packed-asset cache below, so
      # the (slow) re-encoding only runs when the assets themselves change.
      - name: Determine stk-assets revision
        id: assets
        run: |
          REV="$(docker run --rm \
            -v "$PWD":/src -w /src \
            "$IMAGE" svnversion wasm/stk-assets 2>/dev/null || true)"
          echo "rev=${REV:-unknown}" >> "$GITHUB_OUTPUT"

      # Packing re-encodes every texture/audio file at three quality levels and
      # is one of the slowest steps. Cache the resulting bundles keyed on the
      # assets revision and the packing scripts; on a hit, pipeline.sh skips
      # packing (SKIP_PACK_IF_PRESENT below).
      - name: Cache packed assets
        uses: actions/cache@v6
        with:
          path: |
            wasm/web/game/data_low.tar.gz.*
            wasm/web/game/data_mid.tar.gz.*
            wasm/web/game/data_high.tar.gz.*
          key: wasm-assets-${{ steps.assets.outputs.rev }}-${{ hashFiles('wasm/pack_assets.sh', 'android/generate_assets.sh', 'data/optimize_data.sh') }}

      - name: Build wasm and pack assets
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -v "$PWD":/src -w /src \
            -e BUILD_TYPE=Release \
            -e STK_ASSETS_DIR=/src/wasm/stk-assets \
            -e SKIP_PACK_IF_PRESENT=1 \
            "$IMAGE" wasm/docker/pipeline.sh

      - name: Upload web root artifact
        uses: actions/upload-artifact@v7
        with:
          name: stk-wasm-web
          path: wasm/web
          if-no-files-found: error

      - name: Deploy to Cloudflare Workers
        if: >-
          github.event_name != 'pull_request' &&
          env.CLOUDFLARE_API_TOKEN != '' &&
          env.CLOUDFLARE_ACCOUNT_ID != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: wasm
          command: deploy
