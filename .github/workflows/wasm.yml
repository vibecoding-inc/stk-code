name: WASM

# Build the WebAssembly port in the same pinned Emscripten container that is
# used locally (wasm/docker/Dockerfile), then deploy the static web root to
# Cloudflare Workers (static assets + a small Worker for the /api/token route,
# configured in wasm/wrangler.jsonc). It is published on the project's own
# workers.dev subdomain.
#
# Deployment only happens on pushes to the wasm branch (or manual runs) and only
# when the Cloudflare secrets are configured. Pull requests build but do not
# deploy.
#
# Required repository secrets for deployment:
#   CLOUDFLARE_API_TOKEN     API token with the "Edit Cloudflare Workers" permission.
#   CLOUDFLARE_ACCOUNT_ID    The Cloudflare account id.

on:
  push:
    branches: [wasm]
  pull_request:
    branches: [wasm]
  workflow_dispatch:

concurrency:
  group: wasm-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: stk-wasm-build:ci
      # Mapped to env so the deploy step's `if` can check whether the Cloudflare
      # credentials are configured (the `secrets` context is not allowed in `if`).
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DISCORD_CLIENT_ID: ${{ secrets.DISCORD_CLIENT_ID }}
      DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run WASM web and worker JS tests
        run: node --test wasm/web/tests/*.test.mjs

      # Cache the compiled WASM binary + patched JS keyed on all C++/CMake/build
      # inputs. On web-only changes (wasm/web/**, wasm/worker/**, etc.) this
      # avoids running CMake, make, and the slow Emscripten wasm-ld link step.
      - name: Cache compiled wasm binary
        id: wasm_bin
        uses: actions/cache@v6
        with:
          path: |
            wasm/web/game/supertuxkart.js
            wasm/web/game/supertuxkart.wasm
          key: wasm-bin-${{ hashFiles('src/**', 'lib/**', 'CMakeLists.txt', 'sources.cmake', 'cmake/**', 'wasm/build.sh', 'wasm/build_deps.sh', 'wasm/patch_js.py', 'wasm/fragments/**', 'wasm/docker/Dockerfile') }}

      # Look up the current stk-assets SVN revision directly over HTTPS so we
      # can check the packed-assets cache BEFORE building/starting Docker.
      - name: Determine remote stk-assets revision
        id: assets
        run: |
          REV="$(curl -fsSL --max-time 15 https://svn.code.sf.net/p/supertuxkart/code/stk-assets/ \
            | sed -n 's/.*Revision \([0-9][0-9]*\):.*/\1/p' | head -n1 || true)"
          echo "rev=${REV:-unknown}" >> "$GITHUB_OUTPUT"

      # Packing re-encodes every texture/audio file at three quality levels and
      # is one of the slowest steps. Cache the resulting bundles keyed on the
      # assets revision and the packing scripts; on a hit, pipeline.sh skips
      # packing (SKIP_PACK_IF_PRESENT below).
      # Note: data/gui/screens and data/gui/dialogs are packed separately into a
      # ~26 KB overlay (wasm/pack_gui_overlay.sh) so .stkgui edits never bust
      # this cache or players' IndexedDB caches.
      - name: Cache packed assets
        id: packed_assets
        if: steps.assets.outputs.rev != 'unknown'
        uses: actions/cache@v6
        with:
          path: |
            wasm/web/game/data_low.tar.gz.*
            wasm/web/game/data_mid.tar.gz.*
            wasm/web/game/data_high.tar.gz.*
            wasm/web/game/data_version.txt
          key: wasm-assets-${{ steps.assets.outputs.rev }}-${{ hashFiles('wasm/pack_assets.sh', 'android/generate_assets.sh', 'data/optimize_data.sh', 'data/gui/icons/**', 'wasm/docker/Dockerfile') }}

      # Only pull/build the Emscripten Docker image when either the WASM binary
      # or the packed assets missed cache. Pure web/worker changes skip Docker
      # completely and deploy in ~20-30s.
      # Try pulling the prebuilt image from GHCR first (keyed by Dockerfile hash)
      # to avoid Buildx container setup + 20s OCI tarball export on every run.
      - name: Pull prebuilt Emscripten build image
        id: docker_image
        if: steps.wasm_bin.outputs.cache-hit != 'true' || steps.packed_assets.outputs.cache-hit != 'true'
        run: |
          OWNER="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          HASH="$(sha256sum wasm/docker/Dockerfile | cut -c1-16)"
          REMOTE_IMAGE="ghcr.io/${OWNER}/stk-wasm-build:${HASH}"
          echo "remote_image=${REMOTE_IMAGE}" >> "$GITHUB_OUTPUT"
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin || true
          if docker pull "$REMOTE_IMAGE"; then
            docker tag "$REMOTE_IMAGE" "$IMAGE"
            echo "hit=true" >> "$GITHUB_OUTPUT"
          else
            echo "hit=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        if: steps.docker_image.outputs.hit == 'false'
        uses: docker/setup-buildx-action@v4

      - name: Build the Emscripten build image
        if: steps.docker_image.outputs.hit == 'false'
        uses: docker/build-push-action@v7
        with:
          context: wasm/docker
          file: wasm/docker/Dockerfile
          tags: ${{ env.IMAGE }}
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Push Emscripten build image to GHCR
        if: steps.docker_image.outputs.hit == 'false' && github.event_name != 'pull_request'
        run: |
          docker tag "$IMAGE" "${{ steps.docker_image.outputs.remote_image }}"
          docker push "${{ steps.docker_image.outputs.remote_image }}" || true

      # The cross-compiled third-party libraries (wasm/prefix) are expensive to
      # build. Only needed when we have to rebuild the WASM binary.
      - name: Cache dependencies
        if: steps.wasm_bin.outputs.cache-hit != 'true'
        uses: actions/cache@v6
        with:
          path: wasm/prefix
          key: wasm-deps-${{ hashFiles('wasm/build_deps.sh', 'wasm/docker/Dockerfile') }}

      # Compiler caches that make recompiling STK fast: ccache (C/C++ object
      # files) and Emscripten's system-library/port cache.
      - name: Cache compiler caches (ccache + emscripten)
        if: steps.wasm_bin.outputs.cache-hit != 'true'
        uses: actions/cache@v6
        with:
          path: |
            wasm/.ccache
            wasm/.emcache
          key: wasm-ccache-${{ github.run_id }}
          restore-keys: |
            wasm-ccache-

      # The external art assets change rarely; only restore/fetch them when the
      # packed-assets cache missed.
      - name: Cache stk-assets
        if: steps.packed_assets.outputs.cache-hit != 'true'
        uses: actions/cache@v6
        with:
          path: wasm/stk-assets
          key: stk-assets-${{ github.run_id }}
          restore-keys: |
            stk-assets-

      - name: Fetch stk-assets
        if: steps.packed_assets.outputs.cache-hit != 'true'
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -v "$PWD":/src -w /src \
            "$IMAGE" wasm/get_assets.sh wasm/stk-assets

      - name: Build wasm and pack assets
        if: steps.wasm_bin.outputs.cache-hit != 'true' || steps.packed_assets.outputs.cache-hit != 'true'
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -v "$PWD":/src -w /src \
            -e BUILD_TYPE=Release \
            -e STK_ASSETS_DIR=/src/wasm/stk-assets \
            -e SKIP_BUILD_IF_PRESENT=1 \
            -e SKIP_PACK_IF_PRESENT=1 \
            "$IMAGE" wasm/docker/pipeline.sh

      - name: Pack GUI overlay
        run: bash wasm/pack_gui_overlay.sh

      - name: Extract Rich Presence track/kart assets
        run: bash wasm/extract_presence_assets.sh

      - name: Ensure runtime config.json
        run: |
          if [ ! -f wasm/web/config.json ]; then
            cp wasm/web/config_example.json wasm/web/config.json
          fi

      # Only upload the ~580 MB web root artifact on PRs (which do not deploy)
      # and manual workflow_dispatch runs. Disable zip re-compression since the
      # asset bundles are already gzipped .tar.gz chunks.
      - name: Upload web root artifact
        if: >-
          github.event_name == 'pull_request' ||
          github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: stk-wasm-web
          path: wasm/web
          compression-level: 0
          if-no-files-found: error

      # Cache Wrangler's npm install in wasm/node_modules so wrangler-action
      # does not re-download 77 packages (~12s) on every deploy.
      - name: Cache Wrangler CLI
        if: >-
          github.event_name != 'pull_request' &&
          env.CLOUDFLARE_API_TOKEN != '' &&
          env.CLOUDFLARE_ACCOUNT_ID != ''
        uses: actions/cache@v6
        with:
          path: wasm/node_modules
          key: wasm-wrangler-v4

      - name: Apply D1 database migrations
        if: >-
          github.event_name != 'pull_request' &&
          env.CLOUDFLARE_API_TOKEN != '' &&
          env.CLOUDFLARE_ACCOUNT_ID != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: wasm
          command: d1 migrations apply stk-time-trials --remote

      - name: Deploy to Cloudflare Workers
        if: >-
          github.event_name != 'pull_request' &&
          env.CLOUDFLARE_API_TOKEN != '' &&
          env.CLOUDFLARE_ACCOUNT_ID != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: wasm
          command: deploy

      - name: Register Discord slash commands
        if: >-
          github.event_name != 'pull_request' &&
          env.DISCORD_CLIENT_ID != '' &&
          env.DISCORD_BOT_TOKEN != ''
        env:
          DISCORD_CLIENT_ID: ${{ secrets.DISCORD_CLIENT_ID }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
        run: node wasm/scripts/register-commands.mjs
